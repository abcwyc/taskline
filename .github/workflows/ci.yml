name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: circle
          POSTGRES_PASSWORD: circle
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://circle:circle@localhost:5432/circle_test
      TEST_DATABASE_URL: postgresql://circle:circle@localhost:5432/circle_test
      AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production audit
        # build-time-only advisories are listed in package.json pnpm.auditConfig;
        # this fails on anything new that isn't.
        run: pnpm audit --prod
